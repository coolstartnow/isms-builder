<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISMS Builder</title>
  <link rel="icon" type="image/x-icon" href="/ui/favicon.ico">
  <link rel="stylesheet" href="vendor/phosphor-regular.css" />
  <style>
    :root { --bg:#1D2125; --surface:#22272B; --raised:#2C333A; --border:#3B4350; --text:#B6C2CF; --text-inv:#FFFFFF; --subtle:#8C9BAB; --accent:#0052CC; --accent-h:#0065FF; --danger:#F97171; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif; font-size: 14px; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text-inv); font-size: 20px; font-weight: 700; margin-bottom: 28px; }
    .brand i { font-size: 28px; color: #4C9AFF; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px 36px; width: 400px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.55); }
    .card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; color: var(--text-inv); }
    .card p { margin: 0 0 22px; font-size: 13px; color: var(--subtle); line-height: 1.5; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--subtle); margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--raised); color: var(--text-inv); font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s; }
    .form-group input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 10px 16px; margin-top: 4px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: var(--accent-h); }
    .btn[disabled] { opacity: .6; cursor: default; }
    .btn-link { background: none; color: var(--subtle); font-weight: 400; margin-top: 10px; }
    .btn-link:hover { background: none; color: var(--text-inv); }
    #msg { display: none; margin-top: 14px; color: var(--danger); font-size: 13px; background: rgba(202,53,33,.12); border: 1px solid rgba(202,53,33,.3); padding: 8px 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="brand"><i class="ph ph-shield-check"></i> ISMS Builder</div>
  <form class="card" id="pwForm" autocomplete="off">
    <h2 id="pwTitle"></h2>
    <p id="pwHint"></p>
    <div class="form-group"><label for="pwCurrent" id="pwCurrentLabel"></label><input id="pwCurrent" type="password" autocomplete="current-password" required /></div>
    <div class="form-group"><label for="pwNew" id="pwNewLabel"></label><input id="pwNew" type="password" autocomplete="new-password" minlength="6" required /></div>
    <div class="form-group"><label for="pwRepeat" id="pwRepeatLabel"></label><input id="pwRepeat" type="password" autocomplete="new-password" minlength="6" required /></div>
    <button class="btn" id="pwSubmit" type="submit"><i class="ph ph-key"></i> <span id="pwSubmitText"></span></button>
    <button class="btn btn-link" id="pwLogout" type="button"><i class="ph ph-sign-out"></i> <span id="pwLogoutText"></span></button>
    <div id="msg" role="alert"></div>
  </form>
  <script src="/ui/i18n/t.js"></script>
  <script src="/ui/i18n/translations.js"></script>
  <script src="change-password.js"></script>
</body>
</html>
