  # ─── MOBILE SYNC ─────────────────────────────────────────────────────────

  /sync/enroll:
    post:
      tags: [sync]
      operationId: syncEnroll
      summary: Set up a device — exchange a setup code for a device key
      description: |
        The setup code comes from the QR code shown in the administration (`POST /admin/sync-accounts/{id}/enrollment`).
        It is single-use and valid for 15 minutes. No login; failed attempts are slowed down.
        The returned device key is shown only in this response and stored on the server only as a hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: ABCD-EFGH-JKMN }
                deviceName: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Device key and account
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocolVersion: { type: integer }
                  key: { type: string }
                  device: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  account:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      permissions: { type: object, additionalProperties: { type: string, enum: [none, read, write] } }
                      expiresAt: { type: string, format: date-time, nullable: true }
        '401':
          description: Setup code invalid, expired, already used, or the account is disabled/expired
        '429':
          description: Too many failed attempts
        '501':
          description: Storage backend is not json

  /sync/me:
    get:
      tags: [sync]
      operationId: syncMe
      summary: Name, permissions and expiry of the sync account
      security:
        - syncKeyAuth: []
      responses:
        '200':
          description: The sync account behind the access key
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocolVersion: { type: integer }
                  id: { type: string }
                  name: { type: string }
                  device: { type: string }
                  permissions:
                    type: object
                    additionalProperties: { type: string, enum: [none, read, write] }
                  expiresAt: { type: string, format: date-time, nullable: true }
        '401':
          description: Missing, invalid, disabled or expired access key
        '429':
          description: Too many failed attempts

  /sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      summary: Changes since a timestamp (incl. soft-deleted records as tombstones)
      description: |
        Returns all records whose latest change (max of updatedAt, deletedAt, createdAt) is
        newer than `since`. Without `since` the full base data set is returned. Store the
        returned `serverTime` and use it as `since` for the next pull.
        Only modules the sync account may read are returned; explicitly requested modules
        without permission are listed under `denied`. Guidance documents are limited to
        those with `minRole` reader.
        `measures` has no permission of its own: a measure is returned if at least one module
        it is linked to (risk, finding, SoA control, policy) is readable. `visibleIds.measures`
        lists the ids of all readable measures (not just changed ones) so a client can drop
        measures it may no longer see.
        Only available with STORAGE_BACKEND=json (otherwise 501).
      security:
        - syncKeyAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: modules
          in: query
          required: false
          description: Comma-separated subset of templates, soa, risks, assets, findings, guidance, measures
          schema: { type: string }
      responses:
        '200':
          description: Changed records per module
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocolVersion: { type: integer, example: 2 }
                  serverTime: { type: string, format: date-time }
                  modules:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: object }
                  visibleIds:
                    type: object
                    description: Ids of all measures the account may read (present when measures were requested)
                    properties:
                      measures: { type: array, items: { type: string } }
        '400':
          description: Unknown module or invalid `since`
        '401':
          description: Not authenticated
        '501':
          description: Storage backend is not json

  /sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      summary: Apply changes from a device
      description: |
        Each record carries `baseUpdatedAt` (the server `updatedAt` the change was based on).
        If the record changed on the server since then — or exists without a base — it is
        NOT overwritten but returned under `conflicts` with the server copy. Accepted records
        get `updatedAt` = server time and are returned so the client can adopt the new stamp.
        Needs `write` permission per module on the sync account; guidance is pull-only.
        Template attachments are never changed by a push.
        `measures` is accepted per record: write access to ALL modules the measure is linked to
        (stored and new state) is required, a new measure needs at least one link, and TOMs,
        governance measures and measures linked to processing activities are rejected. Rejected
        records are listed under `rejected` with a `code` (`no_write`, `no_link`, `locked_tom`,
        `locked_governance`, `locked_vvt`, `unlinked`). A reference already in use is replaced by
        the next free one (returned in `accepted`). `treatmentPlans` / `actions` embedded in risk
        or finding records are ignored: treatments and actions are measures of the register.
        Protocol 1 is rejected with 409.
      security:
        - syncKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocolVersion, changes]
              properties:
                protocolVersion: { type: integer, example: 2 }
                changes:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string }
                        baseUpdatedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Per-module result
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocolVersion: { type: integer }
                  serverTime: { type: string, format: date-time }
                  accepted:
                    type: object
                    additionalProperties: { type: array, items: { type: object } }
                  conflicts:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: string }
                          server: { type: object }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        module: { type: string }
                        id: { type: string }
                        reason: { type: string }
        '400':
          description: Invalid body or unknown module
        '401':
          description: Missing, invalid, disabled or expired access key
        '409':
          description: Unsupported sync protocol version
        '501':
          description: Storage backend is not json

  # ─── SYNC ACCOUNTS (administration) ──────────────────────────────────────

  /admin/sync-accounts:
    get:
      tags: [sync]
      operationId: listSyncAccounts
      summary: List sync accounts (admin) — never contains access keys
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Array of sync accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncAccount' }
    post:
      tags: [sync]
      operationId: createSyncAccount
      summary: Create a sync account (admin); devices are added afterwards via enrollment
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name: { type: string, maxLength: 80 }
                permissions:
                  type: object
                  description: Level per module (templates, soa, risks, assets, findings, guidance); at least one must not be `none`; guidance is capped at `read`
                  additionalProperties: { type: string, enum: [none, read, write] }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/SyncAccount' }
        '400':
          description: Invalid name, permissions or expiry date
        '409':
          description: A sync account with this name already exists

  /admin/sync-accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [sync]
      operationId: updateSyncAccount
      summary: Rename, change permissions/expiry, disable or enable (admin)
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                permissions: { type: object, additionalProperties: { type: string, enum: [none, read, write] } }
                expiresAt: { type: string, format: date-time, nullable: true }
                active: { type: boolean }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncAccount' }
        '400': { description: Invalid input }
        '404': { description: Not found }
        '409': { description: Name already in use }
    delete:
      tags: [sync]
      operationId: deleteSyncAccount
      summary: Delete a sync account; its access key stops working immediately (admin)
      security:
        - cookieAuth: []
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }

  /admin/sync-accounts/{id}/enrollment:
    post:
      tags: [sync]
      operationId: startSyncEnrollment
      summary: Create a setup code and QR code for a new device (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serverUrl]
              properties:
                serverUrl: { type: string, description: Address under which the app reaches the server }
      responses:
        '200':
          description: Setup code (15 minutes, single-use) and QR code as data URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
                  serverUrl: { type: string }
                  payload: { type: string, description: 'Content of the QR code (`isms-sync://enroll?u=…&c=…`)' }
                  qr: { type: string, description: PNG data URI }
        '400': { description: Invalid server address }
        '404': { description: Not found }

  /admin/sync-accounts/{id}/devices:
    post:
      tags: [sync]
      operationId: createSyncDeviceKey
      summary: Create a device key directly, e.g. for scripts (admin); shown only once
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        '201':
          description: Device and key
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/SyncAccount' }
                  device: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  token: { type: string }
        '404': { description: Not found }

  /admin/sync-accounts/{id}/devices/{deviceId}:
    delete:
      tags: [sync]
      operationId: deleteSyncDevice
      summary: Block a single device; its key stops working immediately (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account without the device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncAccount' }
        '404': { description: Not found }
