openapi: 3.0.3

info:
  title: ISMS Builder API
  version: 1.0.0
  description: |
    REST API for the ISMS Builder platform — a self-hosted Information Security
    Management System (ISMS) according to ISO 27001:2022, NIS2, GDPR, BSI
    IT-Grundschutz and other frameworks.

    **Authentication:** All protected endpoints require a valid JWT cookie
    (`sm_session`). Obtain it via `POST /login`.

    **RBAC Roles (ascending rank):**
    - `reader` / `revision` (rank 1) — read access
    - `editor` / `dept_head` / `qmb` (rank 2) — create/edit
    - `contentowner` / `auditor` (rank 3) — approve, CISO/DSB settings
    - `admin` (rank 4) — user management, delete, system config

  contact:
    name: Claude Hecker
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: /
    description: Self-hosted instance

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sm_session
    syncKeyAuth:
      type: http
      scheme: bearer
      description: Device key of a sync account, e.g. `ISMS-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX`. It is created when a device is set up with a setup code (`POST /sync/enroll`) or explicitly for scripts by an administrator.

  schemas:
    SyncAccount:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        devices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              createdAt: { type: string, format: date-time }
              lastUsedAt: { type: string, format: date-time, nullable: true, description: Most recent use of any device }
        enrollment:
          type: object
          nullable: true
          description: Pending setup code (expiry only; never the code itself)
          properties:
            expiresAt: { type: string, format: date-time }
        permissions:
          type: object
          additionalProperties: { type: string, enum: [none, read, write] }
        expiresAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
    CommonFields:
      type: object
      properties:
        id:
          type: string
          example: lx3k8fab2c
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        linkedControls:
          type: array
          items:
            type: string
          example: ["ISO-5.1", "BSI-ORP.3"]
        linkedPolicies:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string

    User:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [reader, revision, editor, dept_head, qmb, contentowner, auditor, admin]
        domain:
          type: string
        sections:
          type: array
          items:
            type: string

    Template:
      allOf:
        - $ref: '#/components/schemas/CommonFields'
        - type: object
          properties:
            type:
              type: string
            language:
              type: string
            title:
              type: string
            content:
              type: string
            owner:
              type: string
            version:
              type: integer
            status:
              type: string
              enum: [draft, review, approved, archived]
            parentId:
              type: string
              nullable: true
            sortOrder:
              type: integer
            nextReviewDate:
              type: string
              format: date
            applicableEntities:
              type: array
              items:
                type: string
            attachments:
              type: array
              items:
                type: object

    SoaControl:
      type: object
      properties:
        id:
          type: string
        framework:
          type: string
        theme:
          type: string
        title:
          type: string
        applicable:
          type: boolean
        status:
          type: string
          enum: [not_started, in_progress, implemented, not_applicable]
        owner:
          type: string
        justification:
          type: string
        linkedTemplates:
          type: array
          items:
            type: string
        applicableEntities:
          type: array
          items:
            type: string

    Measure:
      type: object
      description: >
        A measure in the central register. The origin follows from the links and flags: linkedRisks (risk treatment),
        linkedFindings (action for a finding), governance (governance measure), tom (TOM, Art. 32 GDPR).
      properties:
        id:
          type: string
          example: meas_mvguknxttncz
        ref:
          type: string
          description: Reference assigned by the server
          example: M-016
        title:
          type: string
        description:
          type: string
        implementation:
          type: string
          description: What has been done (evidence for auditors)
        responsible:
          type: string
        dueDate:
          type: string
          format: date
          nullable: true
        reviewDate:
          type: string
          format: date
          nullable: true
        completedDate:
          type: string
          format: date
          nullable: true
          description: Set automatically when the status becomes implemented or verified and no date is given
        status:
          type: string
          enum: [planned, in_progress, implemented, verified, cancelled]
        linkedControls:
          type: array
          items: { type: string }
        linkedFindings:
          type: array
          items: { type: string }
          description: Changing requires auditor or contentowner
        linkedRisks:
          type: array
          items: { type: string }
          description: Changing requires auditor or contentowner
        linkedPolicies:
          type: array
          items: { type: string }
        linkedVvt:
          type: array
          items: { type: string }
        applicableEntities:
          type: array
          items: { type: string }
        tom:
          type: boolean
          description: TOM flag — creating or changing requires contentowner
        category:
          type: string
          enum: ['', access, encryption, logging, network, application, backup, organizational, training, retention]
        riskLevel:
          type: string
          enum: ['', low, medium, high, critical]
        evidenceNote:
          type: string
        retentionRule:
          type: string
        governance:
          type: boolean
          description: Governance flag — deleting requires admin
        source:
          type: string
          enum: ['', management_review, internal_audit, external_audit, incident, other]
        sourceRef:
          type: string
        priority:
          type: string
          enum: ['', low, medium, high, critical]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        ownerEmail:
          type: string
        entityId:
          type: string
        notes:
          type: string
        attachments:
          type: array
          description: Read-only here; set only by the governance upload routes
          items: { type: object }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        deletedAt: { type: string, format: date-time, nullable: true }
        deletedBy: { type: string, nullable: true }

    Risk:
      allOf:
        - $ref: '#/components/schemas/CommonFields'
        - type: object
          properties:
            title:
              type: string
            category:
              type: string
            description:
              type: string
            probability:
              type: integer
              minimum: 1
              maximum: 5
            impact:
              type: integer
              minimum: 1
              maximum: 5
            score:
              type: integer
            inherentProbability:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
              description: Inhärente Wahrscheinlichkeit (vor Maßnahmen), optional
            inherentImpact:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
            targetProbability:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
              description: Zielwert nach Umsetzung des Behandlungsplans, optional
            targetImpact:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
            inherentScore:
              type: integer
              nullable: true
              readOnly: true
            targetScore:
              type: integer
              nullable: true
              readOnly: true
            treatment:
              type: string
              enum: [mitigate, accept, avoid, transfer]
            status:
              type: string
              enum: [open, in_progress, closed]
            owner:
              type: string
            linkedAssets:
              type: array
              items: { type: string }
              description: IDs verknüpfter Assets
            linkedAssetTypes:
              type: array
              items: { type: string }
              description: IDs verknüpfter Asset-Typen (Klassen)
            linkedSuppliers:
              type: array
              items: { type: string }
              description: IDs verknüpfter Lieferanten
            treatments:
              type: array
              items:
                type: object

    Asset:
      allOf:
        - $ref: '#/components/schemas/CommonFields'
        - type: object
          properties:
            name:
              type: string
            category:
              type: string
              enum: [hardware, software, data, service, facility]
            type:
              type: string
            classification:
              type: string
              enum: [public, internal, confidential, strictly_confidential]
            criticality:
              type: string
              enum: [low, medium, high, critical]
            owner:
              type: string
            location:
              type: string
            status:
              type: string
            endOfLifeDate:
              type: string
              format: date
            entityId:
              type: string

    Goal:
      allOf:
        - $ref: '#/components/schemas/CommonFields'
        - type: object
          properties:
            title:
              type: string
            description:
              type: string
            category:
              type: string
            status:
              type: string
              enum: [planned, active, achieved, missed, cancelled]
            priority:
              type: string
              enum: [low, medium, high, critical]
            owner:
              type: string
            targetDate:
              type: string
              format: date
            reviewDate:
              type: string
              format: date
            progress:
              type: integer
            kpis:
              type: array
              items:
                type: object

    Entity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        short:
          type: string
        type:
          type: string
          enum: [holding, subsidiary, branch, department]
        parentId:
          type: string
          nullable: true
        sortOrder:
          type: integer

tags:
  - name: auth
    description: Authentication, session management, 2FA
  - name: templates
    description: Policy/procedure templates, versioning, hierarchy, attachments
  - name: entities
    description: Corporate/organisational entity structure
  - name: soa
    description: Statement of Applicability — controls across 8 frameworks
  - name: measures
    description: Measures register — one data set for risk treatments, finding actions, governance measures and TOMs (V 1.80)
  - name: risks
    description: Risk register and treatment plans
  - name: goals
    description: Security objectives / KPI tracking (ISO 27001 §6.2)
  - name: assets
    description: Asset inventory and classification (ISO 27001 A.5.9–5.12)
  - name: governance
    description: Management reviews, action items, meeting minutes
  - name: bcm
    description: Business continuity — BIA, plans, exercises
  - name: calendar
    description: Aggregated calendar events from all modules
  - name: guidance
    description: Guidance documents with file upload
  - name: gdpr
    description: GDPR & privacy — VVT, AV, DSFA, TOMs, DSAR, incidents, DSB
  - name: reports
    description: Compliance matrix, gap analysis, CSV export
  - name: legal
    description: Contracts, NDAs, privacy policies
  - name: training
    description: Training records and completion tracking
  - name: admin
    description: User management, org settings, audit log, maintenance
  - name: public
    description: Public endpoints (no authentication required)
  - name: trash
    description: Soft-delete trash, restore, permanent delete
  - name: sync
    description: Delta sync for the mobile (Android) app — templates, SoA, risks, assets, findings, guidance

paths:

  # ─── AUTH ────────────────────────────────────────────────────────────────

  /login:
    post:
      tags: [auth]
      summary: Authenticate and obtain session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                totpCode:
                  type: string
                  description: TOTP code (required if 2FA is enabled)
      responses:
        '200':
          description: Login successful — sets sm_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  role:
                    type: string
                  has2FA:
                    type: boolean
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 2FA required or TOTP invalid

  /whoami:
    get:
      tags: [auth]
      summary: Get current authenticated user info
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      has2FA:
                        type: boolean
        '401':
          description: Not authenticated

  /logout:
    get:
      tags: [auth]
      summary: Logout — clears session cookie
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out

  /me/password:
    put:
      tags: [auth]
      summary: Change own password
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed
        '400':
          description: Current password wrong or validation error
        '401':
          description: Not authenticated

  /2fa/setup:
    get:
      tags: [auth]
      summary: Initiate 2FA setup — returns QR code URI and secret
      security:
        - cookieAuth: []
      responses:
        '200':
          description: QR code data
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrDataUri:
                    type: string
                    description: Data URI of QR code image
                  secret:
                    type: string
                    description: Base32 TOTP secret

  /2fa/verify:
    post:
      tags: [auth]
      summary: Verify TOTP code and activate 2FA
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 2FA activated
        '400':
          description: Invalid code

  /2fa:
    delete:
      tags: [auth]
      summary: Disable 2FA for current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 2FA disabled

  # ─── TEMPLATES ───────────────────────────────────────────────────────────

  /templates:
    get:
      tags: [templates]
      summary: List templates
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Array of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'

  /templates/tree:
    get:
      tags: [templates]
      summary: Get templates as a nested tree (by type/language)
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Nested tree structure
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /templates/reorder:
    post:
      tags: [templates]
      summary: Batch-update sortOrder for sibling templates (contentowner+)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      sortOrder:
                        type: integer
      responses:
        '200':
          description: Reordered

  /template:
    post:
      tags: [templates]
      summary: Create a new template (contentowner+)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, language, title]
              properties:
                type:
                  type: string
                language:
                  type: string
                title:
                  type: string
                content:
                  type: string
                parentId:
                  type: string
                  nullable: true
                linkedControls:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'

  /template/{type}/{id}:
    get:
      tags: [templates]
      summary: Get a single template
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: Not found
    put:
      tags: [templates]
      summary: Update a template (editor+)
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '200':
          description: Updated template
    delete:
      tags: [templates]
      summary: Soft-delete a template (admin)
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted

  /template/{type}/{id}/move:
    put:
      tags: [templates]
      summary: Move template to new parent (contentowner+)
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId:
                  type: string
                  nullable: true
                sortOrder:
                  type: integer
      responses:
        '200':
          description: Moved
        '400':
          description: Circular reference detected

  /template/{type}/{id}/history:
    get:
      tags: [templates]
      summary: Get version history for a template
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of historical versions

  /audits:
    get:
      tags: [audits]
      summary: List audits
      security:
        - cookieAuth: []
      parameters:
        - { name: status,    in: query, schema: { type: string, enum: [planned, in_progress, completed, cancelled] } }
        - { name: type,      in: query, schema: { type: string, enum: [internal, external, supplier, certification] } }
        - { name: year,      in: query, schema: { type: integer }, description: Year of the planned start }
        - { name: programId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Array of audits (with checklist)
    post:
      tags: [audits]
      summary: Create an audit (auditor / contentowner)
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Created (reference AUD-YYYY-NNNN)

  /audits/summary:
    get:
      tags: [audits]
      summary: "Counts: total, byStatus, overdue, upcoming (30 days), nonconform"
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Summary object

  /audits/{id}:
    get:
      tags: [audits]
      summary: Get an audit including its assigned findings
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Audit with findings[]
        '404':
          description: Not found
    put:
      tags: [audits]
      summary: Update an audit
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated audit
    delete:
      tags: [audits]
      summary: Move an audit to the trash (restore and permanent delete via /audits/{id}/restore and /permanent, admin)
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted

  /audits/{id}/checklist:
    post:
      tags: [audits]
      summary: Add a checklist item (controlId, question, result, evidence, notes)
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created item

  /audits/{id}/checklist/{itemId}:
    put:
      tags: [audits]
      summary: Update a checklist item (result enum open, conform, nonconform, not_applicable)
      security:
        - cookieAuth: []
      parameters:
        - { name: id,     in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated item
    delete:
      tags: [audits]
      summary: Delete a checklist item
      security:
        - cookieAuth: []
      parameters:
        - { name: id,     in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted

  /audits/{id}/checklist/{itemId}/finding:
    post:
      tags: [audits]
      summary: Create a pre-filled finding from a checklist item (once per item)
      security:
        - cookieAuth: []
      parameters:
        - { name: id,     in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created finding (auditId and sourceItemId set)
        '409':
          description: A finding already exists for this item

  /audit-programs:
    get:
      tags: [audits]
      summary: List audit programmes (annual plans)
      security:
        - cookieAuth: []
      parameters:
        - { name: year,   in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [draft, approved] } }
      responses:
        '200':
          description: Array of programmes
    post:
      tags: [audits]
      summary: Create an audit programme (reference AP-YYYY-NNNN)
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Created

  /audit-programs/{id}:
    get:
      tags: [audits]
      summary: Get a programme including its audits
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Programme with audits[]
    put:
      tags: [audits]
      summary: Update a programme (409 once approved)
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated programme
        '409':
          description: Programme is approved

  /audit-programs/{id}/approve:
    post:
      tags: [audits]
      summary: Approve a programme (locks it; /reopen sets it back to draft)
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
