  /measures:
    get:
      tags: [measures]
      summary: List measures
      description: >
        Filters are combined with AND. The register covers all origins; use `risk`, `finding`, `governance` and `tom`
        to select an origin.
      security:
        - cookieAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Full-text search (reference, title, description, implementation, notes, source reference, responsible)' }
        - { name: status, in: query, schema: { type: string, enum: [planned, in_progress, implemented, verified, cancelled] } }
        - { name: responsible, in: query, schema: { type: string }, description: Substring match }
        - { name: control, in: query, schema: { type: string }, description: SoA control id }
        - { name: finding, in: query, schema: { type: string }, description: Finding id }
        - { name: risk, in: query, schema: { type: string }, description: Risk id }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: tom, in: query, schema: { type: boolean } }
        - { name: governance, in: query, schema: { type: boolean } }
        - { name: source, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: Array of measures, sorted by reference
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measure'
    post:
      tags: [measures]
      summary: Create a measure (editor+)
      description: >
        Setting `tom` requires contentowner; setting `linkedRisks` or `linkedFindings` requires auditor or contentowner.
        Unknown risk, finding or control ids are rejected with 400.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Measure'
      responses:
        '201':
          description: Created measure with a generated reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measure'
        '400':
          description: Invalid input or unknown link
        '403':
          description: Role too low for TOM or for links to risks/findings

  /measures/summary:
    get:
      tags: [measures]
      summary: Key figures
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Totals by status, overdue, without links (TOMs and governance measures excluded), number of TOMs

  /measures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [measures]
