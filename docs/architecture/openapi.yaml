      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Measure'
      responses:
        '200':
          description: Updated measure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measure'
        '400':
          description: Invalid input or unknown link
        '403':
          description: Role too low
        '404':
          description: Not found
    delete:
      tags: [measures]
      summary: Delete a measure (contentowner+; governance measures admin)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Moved to the trash
        '403':
          description: Role too low
