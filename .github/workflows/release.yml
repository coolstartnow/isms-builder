name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        # Verhindert die Drift, die zu v1.37.5.1 gefuehrt hat: der Tag wurde
        # gepusht, ohne vorher scripts/bump-version.sh laufen zu lassen, und
        # package.json blieb auf der Vorversion stehen — die App zeigte danach
        # (siehe /api/version) die falsche Version an, bis das manuell auffiel.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu package.json (${PKG_VERSION}). Vor dem Taggen 'bash scripts/bump-version.sh ${TAG_VERSION}' ausfuehren und committen."
            exit 1
          fi
          echo "OK: Tag ${GITHUB_REF_NAME} passt zu package.json (${PKG_VERSION})"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          STORAGE_BACKEND: json

      - name: Create deployment archive
        run: |
          tar --exclude=node_modules --exclude=data --exclude=ssl \
              --exclude=.env --exclude='.git' --exclude='*.log' \
              --warning=no-file-changed \
              -czf isms-builder-${{ github.ref_name }}.tar.gz . || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: isms-builder-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          body: |
            ## ISMS Builder ${{ github.ref_name }}

            ### Quick Start
            ```bash
            tar -xzf isms-builder-${{ github.ref_name }}.tar.gz
            npm install
            cp .env.example .env   # JWT_SECRET setzen
            npm start
            ```

            See [CHANGELOG](CHANGELOG.md) and [documentation](docs/ISMS-build-documentation.md) for details.

  # ── Docker-Image als GitHub Package ──────────────────────────────────────
  # Veroeffentlicht nach einem erfolgreichen Release:
  #   ghcr.io/<owner>/isms-builder:<version>  und  :latest
  # Laeuft nur, wenn der Release-Job durch ist — also nach Tests und
  # Versionsabgleich.
  docker-image:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # Push in die Registry
      id-token: write        # OIDC-Token fuer die Provenance-Attestation
      attestations: write

    env:
      REGISTRY: ghcr.io
      # Folgt dem Repo, damit ein Fork in seine eigene Namespace veroeffentlicht
      # statt am 403 gegen Upstream zu scheitern (Kleinschreibung vorausgesetzt).
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU nur fuer den emulierten arm64-Teil: better-sqlite3 zieht dort ein
      # linuxmusl-Prebuild und kompiliert nicht selbst — node:lts-alpine hat
      # bewusst keine Build-Toolchain an Bord.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=match statt type=semver: die Projektversion ist zeitweise
          # vierteilig (1.37.5.1) und damit kein gueltiges semver — type=semver
          # wuerde solche Tags stillschweigend ueberspringen.
          flavor: latest=true
          tags: |
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.title=ISMS Builder
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Ein Image, das baut, ist nicht dasselbe wie ein Image, das laeuft:
      # Container aus dem Digest starten und /ui/login.html abfragen.
      - name: Smoke test published image
        run: |
          docker run -d --name isms-smoke -p 3000:3000 \
            -e JWT_SECRET=smoke-test-secret-not-for-production \
            -e STORAGE_BACKEND=json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ui/login.html > /dev/null; then
              echo "OK: Container antwortet auf /ui/login.html"
              docker rm -f isms-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container ist innerhalb von 60s nicht erreichbar geworden."
          docker logs isms-smoke
          exit 1

      # Signierte Provenance, pruefbar per:
      #   gh attestation verify oci://ghcr.io/<owner>/isms-builder:latest --owner <owner>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Summary
        run: |
          {
            echo "### Veroeffentlicht"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
